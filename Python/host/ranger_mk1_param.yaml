
module: Ranger-mk1
parameter_database_version: 0.1


parameters:

  drv_enable:
    id: 0x20
    type: u8
    access: Read / Write
    default: 0
    unit: Bool
    reboot_required: false
    persistent: false
    description: Enable DRV8462 driver

  microstep_mode:
    id: 0x21
    type: u8
    access: Read / Write
    default: 16
    unit: milli volt (mV)
    reboot_required: false
    persistent: false
    description: microstepping, 0 = full-step, 2 = half-step, 

  bus_voltage_mv:
    id: 0x30
    type: u32
    access: Read / Write
    unit: milli volt (mV)
    reboot_required: false
    persistent: false
    description: Enable DRV8462 driver